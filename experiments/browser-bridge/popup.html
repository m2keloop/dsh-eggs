<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>本地连接实验</title></head>
<body style="font:14px system-ui; width:280px; padding:12px; line-height:1.5">
  <h1 style="font-size:16px">DSH Eggs 本地连接实验</h1>
  <p>实验：本地连接；点击检查时只读取当前 Epic 官方页的按钮和登录状态，不读取账号或 Cookie。</p>
  <button id="ping" type="button">测试本地连接</button>
  <button id="push" type="button">测试接收任务</button>
  <button id="inspect" type="button">检查当前 Epic 页面</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
